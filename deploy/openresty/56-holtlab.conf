# holtlab.abstracteducation.loan: holt lab, the test partner site (holt lab/server.mjs), set up the way a real
# partner's web server would be: the lab app at /, holt at /chat/ with the lab's license.
#
# The name is a DNS-only CNAME to byod.abstracteducation.loan, so the edges terminate TLS and relay it
# here (like holt.abstracteducation.loan, 55-holt.conf). Installed by hand at
# /etc/openresty/conf.d/56-holtlab.conf; the license is in the root-only /etc/openresty/holtlab-license.conf.

server {
    listen 9080;
    listen [::]:9080;
    server_name holtlab.abstracteducation.loan;

    if ($http_x_byod_token = "") {
        return 403 "Forbidden";
    }

    location = /chat {
        absolute_redirect off;
        return 301 /chat/;
    }

    location ^~ /chat/ {
        proxy_pass http://127.0.0.1:8830/lab/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        # The chatbox's realtime socket (/chat/_holt/api/rt) is a WebSocket: pass the upgrade through.
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $connection_upgrade;
        include /etc/openresty/holtlab-license.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8840;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 16k;
    }
}
