# holt.abstracteducation.loan on amph's origin-internal listener.
#
# The name is a DNS-only CNAME to byod.abstracteducation.loan, so the edges terminate TLS (shared
# on-demand certificate) and relay it here with Host, X-Real-IP and X-BYOD-Token
# (abulxt deploy/ansible/roles/edge_relay/templates/byod-edge.conf.j2).
#
# Installed by hand at /etc/openresty/conf.d/55-holt.conf (CI never touches OpenResty). The 55 keeps
# it after 50-origin-internal.conf, whose catch-all server stays the default for :9080. The token
# check mirrors that file's (non-empty); :9080 is firewalled to the edge subnets.

server {
    listen 9080;
    listen [::]:9080;
    server_name holt.abstracteducation.loan;

    if ($http_x_byod_token = "") {
        return 403 "Forbidden";
    }

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8830;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The edge already set these to the end client.
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Realtime arrives with the chat API (phase 1).
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
